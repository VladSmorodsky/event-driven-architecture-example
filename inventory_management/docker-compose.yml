services:
  inventory:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - '9000:9000'
    healthcheck:
      test: ping 0.0.0.0 -p 9000 -c 1
      interval: 60s
      timeout: 10s
      retries: 1
    networks:
      - rabbitmq-network

  inventory_consumer:
    build: .
    command: python -m consumer.main
    depends_on:
      - inventory
    volumes:
      - .:/app
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
    networks:
      - rabbitmq-network

  db:
    image: postgres:17.4
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - rabbitmq-network

volumes:
  pg_data: { }

networks:
  rabbitmq-network:
    external: true